    <rect x="854" y="220" width="44" height="26" rx="6"/><rect x="912" y="220" width="44" height="26" rx="6"/>
    <rect x="970" y="220" width="44" height="26" rx="6"/><rect x="1028" y="220" width="44" height="26" rx="6"/>
  </g>

  <!-- not equal -->
