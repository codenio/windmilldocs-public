  <!-- Title -->
  <text x="80" y="345" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="62" font-weight="700" fill="#ffffff" letter-spacing="-0.03em">Don't split dbt</text>

  <!-- Subtitle -->
  <text x="80" y="400" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="24" font-weight="400" fill="#94a3b8">Task per model is slower and breaks resume</text>
