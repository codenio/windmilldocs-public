<svg width="1200" height="680" viewBox="0 0 1200 680" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#0f1c33"/>
    </linearGradient>
    <linearGradient id="artifact" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#1E3A8A" stop-opacity="0.30"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.92" r="0.95">
      <stop offset="0" stop-color="#1E3A8A" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#1E3A8A" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#60a5fa"/>
    </marker>
  </defs>

  <rect width="1200" height="680" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="680" rx="24" fill="url(#glow)"/>

  <text x="90" y="84" fill="#ffffff" font-size="40" font-weight="700" letter-spacing="-0.02em">What dbt produces, and what reads it</text>
  <text x="90" y="120" fill="#94a3b8" font-size="21" font-weight="400">Two files in target/ carry the rest of this post: one is the graph, the other is the checkpoint.</text>

  <!-- ===== your project ===== -->
  <text x="90" y="196" fill="#64748b" font-size="14" font-weight="600" letter-spacing="0.10em">YOUR PROJECT</text>
  <g fill="#e2e8f0" font-size="19">
    <text x="90" y="236">models/stg_orders.sql</text>
    <text x="90" y="268">models/orders_daily.sql</text>
    <text x="90" y="300">dbt_project.yml</text>
    <text x="90" y="332">profiles.yml</text>
  </g>
  <text x="90" y="370" fill="#94a3b8" font-size="16">ref() names the edges between models</text>

  <line x1="360" y1="284" x2="412" y2="284" stroke="#60a5fa" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- parse -->
  <rect x="425" y="256" width="150" height="56" rx="28" fill="#1E3A8A" fill-opacity="0.35" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="500" y="291" fill="#e2e8f0" font-size="20" font-weight="600" text-anchor="middle">dbt parse</text>

  <line x1="585" y1="284" x2="637" y2="284" stroke="#60a5fa" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- manifest.json -->
  <rect x="650" y="248" width="300" height="72" rx="12" fill="url(#artifact)" stroke="#3B82F6" stroke-width="2"/>
  <text x="800" y="281" fill="#ffffff" font-size="21" font-weight="700" text-anchor="middle">target/manifest.json</text>
  <text x="800" y="305" fill="#93c5fd" font-size="15" text-anchor="middle">the parsed project and its DAG</text>
  <text x="975" y="290" fill="#94a3b8" font-size="16">every integration reads this</text>

  <line x1="800" y1="320" x2="800" y2="392" stroke="#60a5fa" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- build -->
  <rect x="700" y="400" width="200" height="56" rx="28" fill="#1E3A8A" fill-opacity="0.35" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="800" y="435" fill="#e2e8f0" font-size="20" font-weight="600" text-anchor="middle">dbt build</text>
  <text x="668" y="429" fill="#94a3b8" font-size="16" text-anchor="end">renders Jinja, wraps each</text>
  <text x="668" y="450" fill="#94a3b8" font-size="16" text-anchor="end">select in DDL</text>

  <line x1="910" y1="428" x2="972" y2="428" stroke="#60a5fa" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- warehouse -->
  <rect x="985" y="400" width="170" height="56" rx="12" fill="#1E3A8A" fill-opacity="0.28" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="1070" y="434" fill="#e2e8f0" font-size="19" font-weight="600" text-anchor="middle">warehouse</text>
  <text x="1070" y="480" fill="#94a3b8" font-size="15" text-anchor="middle">dbt sends SQL and waits;</text>
  <text x="1070" y="500" fill="#94a3b8" font-size="15" text-anchor="middle">threads are open connections</text>

  <line x1="800" y1="464" x2="800" y2="530" stroke="#60a5fa" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- run_results.json -->
  <rect x="610" y="538" width="380" height="76" rx="12" fill="url(#artifact)" stroke="#3B82F6" stroke-width="2"/>
  <text x="800" y="572" fill="#ffffff" font-size="21" font-weight="700" text-anchor="middle">target/run_results.json</text>
  <text x="800" y="596" fill="#93c5fd" font-size="15" text-anchor="middle">what ran, node by node, with status and timing</text>
  <text x="800" y="644" fill="#94a3b8" font-size="16" text-anchor="middle">dbt retry resumes from this</text>

  <!-- callout: ephemeral -->
  <rect x="90" y="532" width="3" height="86" fill="#3B82F6" fill-opacity="0.85"/>
  <text x="114" y="556" fill="#94a3b8" font-size="16">ephemeral models are nodes in the manifest</text>
  <text x="114" y="580" fill="#94a3b8" font-size="16">that never become objects in the warehouse.</text>
  <text x="114" y="608" fill="#cbd5e1" font-size="16" font-weight="600">A node is not always a unit of work.</text>
</svg>
