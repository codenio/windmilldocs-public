<svg width="1200" height="660" viewBox="0 0 1200 660" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#0f1c33"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.9" r="0.95">
      <stop offset="0" stop-color="#1E3A8A" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#1E3A8A" stop-opacity="0"/>
    </radialGradient>
    <marker id="deferarrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#fbbf24"/>
    </marker>
  </defs>

  <rect width="1200" height="660" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="660" rx="24" fill="url(#glow)"/>

  <text x="90" y="80" fill="#ffffff" font-size="38" font-weight="700" letter-spacing="-0.02em">Workspace forks are copy-on-write</text>
  <text x="90" y="116" fill="#94a3b8" font-size="20" font-weight="400">A fork rebuilds only the node you touch. Everything else reads through to production, read-only.</text>

  <!-- ===== PARENT panel ===== -->
  <rect x="80" y="162" width="380" height="410" rx="16" fill="#1E3A8A" fill-opacity="0.10" stroke="#3B82F6" stroke-opacity="0.4" stroke-width="1.5"/>
  <text x="104" y="200" fill="#ffffff" font-size="19" font-weight="700" letter-spacing="0.02em">PARENT LAKE</text>
  <text x="104" y="222" fill="#94a3b8" font-size="13.5">production &#183; ducklake://main</text>
  <text x="104" y="244" fill="#fbbf24" font-size="13.5">attached read-only to forks</text>

  <!-- ===== FORK panel ===== -->
  <rect x="740" y="162" width="380" height="410" rx="16" fill="#1E3A8A" fill-opacity="0.10" stroke="#3B82F6" stroke-opacity="0.4" stroke-width="1.5"/>
  <text x="764" y="200" fill="#ffffff" font-size="19" font-weight="700" letter-spacing="0.02em">FORK</text>
  <text x="764" y="222" fill="#94a3b8" font-size="13.5">your dev environment</text>
  <text x="764" y="244" fill="#94a3b8" font-size="13.5">writes to __wm_forks/&lt;id&gt;/</text>

  <!-- ===== rows: parent pill | connector | fork slot ===== -->
  <!-- row 1: orders_raw (deferred) -->
  <rect x="100" y="273" width="340" height="52" rx="10" fill="#1E3A8A" fill-opacity="0.30" stroke="#3B82F6" stroke-opacity="0.45"/>
  <text x="120" y="298" fill="#ffffff" font-size="17" font-weight="600">orders_raw</text>
  <text x="120" y="316" fill="#94a3b8" font-size="12">materialized</text>
  <line x1="448" y1="299" x2="752" y2="299" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6 6" stroke-opacity="0.75" marker-end="url(#deferarrow)"/>
  <rect x="760" y="273" width="340" height="52" rx="10" fill="#fbbf24" fill-opacity="0.06" stroke="#fbbf24" stroke-opacity="0.5" stroke-dasharray="7 5"/>
  <text x="780" y="305" fill="#e2e8f0" font-size="17" font-weight="600">orders_raw</text>
  <rect x="982" y="286" width="98" height="26" rx="13" fill="#fbbf24" fill-opacity="0.14"/>
  <text x="1031" y="304" fill="#fbbf24" font-size="14" font-weight="600" text-anchor="middle">deferred</text>

  <!-- row 2: customers (deferred) -->
  <rect x="100" y="345" width="340" height="52" rx="10" fill="#1E3A8A" fill-opacity="0.30" stroke="#3B82F6" stroke-opacity="0.45"/>
  <text x="120" y="370" fill="#ffffff" font-size="17" font-weight="600">customers</text>
  <text x="120" y="388" fill="#94a3b8" font-size="12">materialized</text>
  <line x1="448" y1="371" x2="752" y2="371" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6 6" stroke-opacity="0.75" marker-end="url(#deferarrow)"/>
  <rect x="760" y="345" width="340" height="52" rx="10" fill="#fbbf24" fill-opacity="0.06" stroke="#fbbf24" stroke-opacity="0.5" stroke-dasharray="7 5"/>
  <text x="780" y="377" fill="#e2e8f0" font-size="17" font-weight="600">customers</text>
  <rect x="982" y="358" width="98" height="26" rx="13" fill="#fbbf24" fill-opacity="0.14"/>
  <text x="1031" y="376" fill="#fbbf24" font-size="14" font-weight="600" text-anchor="middle">deferred</text>

  <!-- row 3: dim_customer (deferred) -->
  <rect x="100" y="417" width="340" height="52" rx="10" fill="#1E3A8A" fill-opacity="0.30" stroke="#3B82F6" stroke-opacity="0.45"/>
  <text x="120" y="442" fill="#ffffff" font-size="17" font-weight="600">dim_customer</text>
  <text x="120" y="460" fill="#94a3b8" font-size="12">materialized</text>
  <line x1="448" y1="443" x2="752" y2="443" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6 6" stroke-opacity="0.75" marker-end="url(#deferarrow)"/>
  <rect x="760" y="417" width="340" height="52" rx="10" fill="#fbbf24" fill-opacity="0.06" stroke="#fbbf24" stroke-opacity="0.5" stroke-dasharray="7 5"/>
  <text x="780" y="449" fill="#e2e8f0" font-size="17" font-weight="600">dim_customer</text>
  <rect x="982" y="430" width="98" height="26" rx="13" fill="#fbbf24" fill-opacity="0.14"/>
  <text x="1031" y="448" fill="#fbbf24" font-size="14" font-weight="600" text-anchor="middle">deferred</text>

  <!-- row 4: orders_daily (fork copy) -->
  <rect x="100" y="489" width="340" height="52" rx="10" fill="#1E3A8A" fill-opacity="0.30" stroke="#3B82F6" stroke-opacity="0.45"/>
  <text x="120" y="514" fill="#ffffff" font-size="17" font-weight="600">orders_daily</text>
  <text x="120" y="532" fill="#94a3b8" font-size="12">materialized</text>
  <text x="600" y="507" fill="#34d399" font-size="13" text-anchor="middle">you rebuilt it</text>
  <text x="600" y="524" fill="#64748b" font-size="12" text-anchor="middle">own copy, no defer</text>
  <rect x="760" y="489" width="340" height="52" rx="10" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-opacity="0.8" stroke-width="1.5"/>
  <text x="780" y="521" fill="#ffffff" font-size="17" font-weight="600">orders_daily</text>
  <rect x="1006" y="502" width="74" height="26" rx="13" fill="#34d399" fill-opacity="0.18"/>
  <text x="1043" y="520" fill="#34d399" font-size="14" font-weight="600" text-anchor="middle">fork</text>

  <!-- defer caption -->
  <text x="600" y="266" fill="#fbbf24" font-size="13" font-weight="500" text-anchor="middle">read-only defer</text>

  <!-- footer -->
  <text x="90" y="614" fill="#ffffff" font-size="20" font-weight="700">Zero-copy: only the table you rebuild is materialized in the fork.</text>
  <text x="90" y="642" fill="#94a3b8" font-size="16">Same ducklake:// URIs and annotations; the rest read through to production, which no fork can write.</text>
</svg>
